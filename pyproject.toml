[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "importtocsv"
version = "0.1.0"
description = "Extract text and tables from PDFs, images, and CAD (DXF/DWG) to CSV for LLM workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "ezdxf>=1.3.0",
    "typer>=0.9.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
importtocsv = "importtocsv.cli:app"
importtocsv-serve = "importtocsv.web_serve:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "reportlab>=4.0", "playwright>=1.40.0", "httpx>=0.26.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["importtocsv*"]

[tool.setuptools.package-data]
importtocsv = ["static/*"]
